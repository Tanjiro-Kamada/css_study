<!DOCTYPE html>
<html>
<head>
<style>
  *{margin:0; padding:0; box-sizing:border-box; font-family: Arial}
  nav{display:flex; justify-content:space-between; padding:20px 8%; background:#fff}
  .hero{height:85vh; display:flex; align-items:center; padding:0 8%; background:#f5f5f5}
  .hero h1{font-size:48px; margin-bottom:15px}
  .hero p{color:#555; margin-bottom:25px}
  .btn{padding:12px 25px; background:black; color:white; border:none; border-radius:6px; cursor:pointer}
  .features{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; padding:60px 8%}
  .card{padding:30px; border:1px solid #eee; border-radius:10px}
</style>
</head>
<body>

<nav>
  <h2>Logo</h2>
  <div>Home About Contact</div>
</nav>

<section class="hero">
  <div>
    <h1>We Build Amazing Websites</h1>
    <p>Clean, fast and modern landing pages that convert.</p>
    <button class="btn">Get Started</button>
  </div>
</section>

<section class="features">
  <div class="card"><h3>Fast</h3><p>Loads in under 1s</p></div>
  <div class="card"><h3>Modern</h3><p>Clean design</p></div>
  <div class="card"><h3>Responsive</h3><p>Works on phone</p></div>
</section>

</body>
</html>
